<!DOCTYPE html>

    <link rel="preconnect" href="https://fonts.googleapis.com">

        tailwind.config = {

    <style>

        .tab-content { display: none; }

<body class="font-sans text-gray-800 bg-gray-50">

    <!-- 1. HEADER (Placeholder) -->
    <div id="header-placeholder">
        <!-- ... (Header dimuat oleh main.js) ... -->
    </div>

    <main class="container mx-auto px-6 py-12 md:py-16 min-h-screen">
        
        <h1 class="text-3xl md:text-4xl font-bold text-gray-900 mb-8">Dashboard Pengguna</h1>

        <!-- Kontainer Dashboard -->
        <div class="flex flex-col md:flex-row gap-8">
            
            <!-- Navigasi Tab (Menu Samping di Desktop) -->
            <aside class="w-full md:w-1/4 lg:w-1/5">
                <div class="sticky top-28">
                    <h2 class="text-lg font-semibold text-gray-500 uppercase tracking-wider mb-4 hidden md:block">Menu</h2>
                    <!-- PERBAIKAN RESPONSIVE: Menambahkan 'flex-wrap' -->
                    <div class="flex flex-row flex-wrap md:flex-col pb-4 md:pb-0">
                        <!-- 
                            Button Tab: 
                            - 'data-tab' me-link ke ID 'tab-content'
                            - 'id' digunakan untuk menyembunyikan (role-based)
                        -->
                        <button data-tab="tab-penambahan" class="tab-button active flex items-center text-left w-full px-4 py-3 rounded-lg font-medium text-gray-600 hover:bg-gray-100 hover:text-accent transition-all duration-200 border-b-4 md:border-b-0 md:border-l-4 border-transparent">
                            <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Penambahan
                        </button>
                        <button data-tab="tab-laporan" class="tab-button flex items-center text-left w-full px-4 py-3 rounded-lg font-medium text-gray-600 hover:bg-gray-100 hover:text-accent transition-all duration-200 border-b-4 md:border-b-0 md:border-l-4 border-transparent">
                            <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 21v-4m0 0V5a2 2 0 012-2h6.5l1 1H21l-3 6 3 6H5a2 2 0 00-2 2zm0 0h18"></path></svg>
                            Laporan
                        </button>
                        <button data-tab="tab-favourite" class="tab-button flex items-center text-left w-full px-4 py-3 rounded-lg font-medium text-gray-600 hover:bg-gray-100 hover:text-accent transition-all duration-200 border-b-4 md:border-b-0 md:border-l-4 border-transparent">
                            <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                            Favourite
                        </button>
                        <!-- Tab Khusus Admin -->
                        <button id="tab-btn-pengguna" data-tab="tab-pengguna" class="tab-button flex hidden items-center text-left w-full px-4 py-3 rounded-lg font-medium text-gray-600 hover:bg-gray-100 hover:text-accent transition-all duration-200 border-b-4 md:border-b-0 md:border-l-4 border-transparent">
                            <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                            Pengguna
                        </button>
                        <button id="tab-btn-kompilasi" data-tab="tab-kompilasi" class="tab-button flex hidden items-center text-left w-full px-4 py-3 rounded-lg font-medium text-gray-600 hover:bg-gray-100 hover:text-accent transition-all duration-200 border-b-4 md:border-b-0 md:border-l-4 border-transparent">
                            <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                            Kompilasi
                        </button>
                    </div>
                </div>
            </aside>
            <!-- Konten Tab (Placeholder HTML) -->
            <section class="w-full md:w-3/4 lg:w-4/5">
                <div id="tab-penambahan" class="tab-content active bg-white p-6 md:p-8 rounded-xl shadow-lg">
                    <p>Memuat konten penambahan...</p>
                </div>
                <div id="tab-laporan" class="tab-content bg-white p-6 md:p-8 rounded-xl shadow-lg">
                    <p>Memuat konten laporan...</p>
                </div>
                <div id="tab-favourite" class="tab-content bg-white p-6 md:p-8 rounded-xl shadow-lg">
                    <p>Memuat konten favorit...</p>
                </div>
                <div id="tab-pengguna" class="tab-content bg-white p-6 md:p-8 rounded-xl shadow-lg">
                    <p>Memuat konten pengguna...</p>
                </div>
                <div id="tab-kompilasi" class="tab-content bg-white p-6 md:p-8 rounded-xl shadow-lg">
                    <p>Memuat konten kompilasi...</p>
                </div>
            </section>
        </div>

    </main>

    <!-- 3. FOOTER (Placeholder) -->
    <div id="footer-placeholder">
        <!-- ... (Footer dimuat oleh main.js) ... -->
    </div>
    
    <!-- 4. MODALS (Placeholder) -->
    <div id="modals-placeholder"></div>
    
    <!-- 5. SCRIPT -->
    <!-- Memuat Skrip Injeksi Komponen -->
    <script src="js/main.js" defer></script>
    
    <!-- Skrip Khusus Halaman Ini -->
    <script>
        /**
         * Fungsi ini akan dipanggil oleh main.js SETELAH
         * semua komponen (header, footer, modals) dimuat.
         */
        function attachPageSpecificListeners() {
            
            const userRole = localStorage.getItem('haloKakaUserRole');

            // --- Helper function untuk memuat Skrip JS secara dinamis ---
            // (Kita tambahkan ini agar bisa memuat file .js)
            function loadScript(filePath) {
                return new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = filePath;
                    script.defer = true;
                    script.onload = () => {
                        console.log(`Skrip ${filePath} berhasil dimuat.`);
                        resolve();
                    };
                    script.onerror = () => reject(new Error(`Gagal memuat skrip: ${filePath}`));
                    document.head.appendChild(script);
                });
            }

            // --- Helper function untuk memuat KONTEN TAB (HTML & JS) ---
            async function loadTabContent(tabId, htmlPath, jsPath) {
                const placeholder = document.getElementById(tabId);
                if (!placeholder || placeholder.classList.contains('hidden')) {
                    return; // Lewati jika placeholder tidak ada atau disembunyikan
                } 
                
                try {
                    // 1. Muat HTML-nya dulu
                    const response = await fetch(htmlPath);
                    if (!response.ok) throw new Error(`File not found: ${htmlPath}`);
                    const html = await response.text();
                    placeholder.innerHTML = html;
                    
                    // 2. Muat JS-nya
                    await loadScript(jsPath);
                    
                    // 3. Panggil fungsi init dari file JS yang baru dimuat
                    if (tabId === 'tab-penambahan') {
                        if (typeof initTabPenambahan === 'function') initTabPenambahan();
                    }
                    // if (tabId === 'tab-laporan') { initTabLaporan(); } 
                    
                } catch (error) {
                    console.error(`Gagal memuat ${filePath}:`, error);
                    placeholder.innerHTML = `<p class="text-red-500">Gagal memuat konten tab.</p>`;
                }
            }

            // --- Fungsi Utama untuk Halaman Dashboard ---
            async function initializeDashboard() {
                // 1. Tampilkan/Sembunyikan Tombol Tab berdasarkan Role
                const tabBtnPengguna = document.getElementById('tab-btn-pengguna');
                const tabBtnKompilasi = document.getElementById('tab-btn-kompilasi');
                const tabPengguna = document.getElementById('tab-pengguna');
                const tabKompilasi = document.getElementById('tab-kompilasi');

                if (userRole === 'Admin') {
                    tabBtnPengguna.classList.remove('hidden');
                    tabBtnKompilasi.classList.remove('hidden');
                } else {
                    tabBtnPengguna.classList.add('hidden');
                    tabBtnKompilasi.classList.add('hidden');
                    if(tabPengguna) tabPengguna.classList.add('hidden'); 
                    if(tabKompilasi) tabKompilasi.classList.add('hidden');
                }

                // 2. Muat Konten Tab secara Paralel
                // PERHATIKAN: Kita sekarang menambahkan path ke file .js
                const tabPromises = [
                    loadTabContent('tab-penambahan', 'components/dashboard/tab_penambahan.html', 'js/tabs/tab_penambahan.js'),
                    // loadTabContent('tab-laporan', 'components/dashboard/tab_laporan.html', 'js/tabs/tab_laporan.js'),
                    // loadTabContent('tab-favourite', 'components/dashboard/tab_favourite.html', 'js/tabs/tab_favourite.js')
                ];
                
                if (userRole === 'Admin') {
                    // tabPromises.push(loadTabContent('tab-pengguna', 'components/dashboard/tab_pengguna.html', 'js/tabs/tab_pengguna.js'));
                    // tabPromises.push(loadTabContent('tab-kompilasi', 'components/dashboard/tab_kompilasi.html', 'js/tabs/tab_kompilasi.js'));
                }

                // (Saya hanya mengaktifkan 'tab_penambahan' untuk saat ini agar sesuai dengan file baru yang kita buat)
                await Promise.all(tabPromises);

                // 3. Pasang listener untuk Pindah Tab
                const tabButtons = document.querySelectorAll('.tab-button');
                const tabContents = document.querySelectorAll('.tab-content');

                tabButtons.forEach(button => {
                    button.addEventListener('click', () => {
                        const targetTab = button.getAttribute('data-tab'); 

                        tabButtons.forEach(btn => btn.classList.remove('active'));
                        button.classList.add('active');

                        tabContents.forEach(content => {
                            content.classList.remove('active');
                        });
                        document.getElementById(targetTab).classList.add('active');
                    });
                });
            }

            // --- Mulai Inisialisasi Dashboard ---
            initializeDashboard();
        }
    </script>
</body>
</html>
